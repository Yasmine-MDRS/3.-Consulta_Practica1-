<div class="card">
  <!-- Imagen -->
  <img class="img" [src]="product.portada" [alt]="product.nombre" />

  <div class="body">

    <!-- Título + precio -->
    <div class="top">
      <h3 class="title">{{ product.nombre }}</h3>
      <span class="price">$ {{ product.precio }}</span>
    </div>

    <!-- Metadatos -->
    <p class="meta">{{ product.autor }}</p>
    <p class="meta">{{ product.editorial }} · {{ product.anio }}</p>
    <p class="meta">ISBN: {{ product.isbn }}</p>
    <p class="meta">{{ product.categoria }}</p>

    <!-- Descripción -->
    <p class="desc">{{ product.descripcion }}</p>

    <!-- Stock -->
    <p class="stock">
      {{ product.stock > 0 ? 'En stock (' + product.stock + ')' : 'Agotado' }}
    </p>

    <!-- Botón -->
    <button class="btn" [disabled]="product.stock === 0" (click)="onAdd()">
      Agregar al carrito
    </button>

  </div>
</div>

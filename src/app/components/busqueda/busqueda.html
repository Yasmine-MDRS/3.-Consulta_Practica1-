<div class="busqueda-container">

  <h2>
    Resultados para: "{{ termino }}"
  </h2>

  @if (productos().length === 0) {

    <p class="sin-resultados">
      No se encontraron productos.
    </p>

  } @else {

    <div class="resultados-grid">

      @for (p of productos(); track p.id) {

        <app-producto-card
          [product]="p"
          (add)="agregar($event)">
        </app-producto-card>

      }

    </div>

  }

</div>

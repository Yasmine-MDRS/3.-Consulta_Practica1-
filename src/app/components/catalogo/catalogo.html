<div class="catalogo">

  @for (p of products(); track p.id) {
    <div class="card">

      <img [src]="p.portada" />

      <h3>{{ p.nombre }}</h3>
      <p>{{ p.autor }}</p>
      <p>{{ p.precio | currency }}</p>

      <button (click)="agregar(p)">
        Agregar al carrito
      </button>
    </div>
  }
</div>
